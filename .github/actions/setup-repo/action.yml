# https://github.com/blockprotocol/blockprotocol/blob/main/.github/actions/warm-up-repo/action.yml

name: Setup Repo
description: Prepares Node & pnpm

runs:
  using: composite

  steps:
    - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      name: Install pnpm
      id: pnpm-install
      with:
        version: 11.24.0
        run_install: false

    - name: Use the pinned Node.js version
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Verify the toolchain
      shell: bash
      run: |
        test "$(node --version)" = "v24.20.0"
        test "$(pnpm --version)" = "11.24.0"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Linux packaging prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y fakeroot rpm
