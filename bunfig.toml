[install]
# Exact versions keep the lockfile reviewable and installs reproducible.
exact = true
# Never auto-install peers: @raycast/utils would otherwise pull Raycast's real
# @raycast/api (CLI, second React) into the tree. Blast provides those itself.
peer = false

[test]
pathIgnorePatterns = [".cache/**"]
preload = ["./scripts/test-env.ts"]
# Tests spawn real runtimes; Bun's 5s default times out machine-dependent
# engine tests (~9s in isolation) before any real assertion can fail.
timeout = 30000
