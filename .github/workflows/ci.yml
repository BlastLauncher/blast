name: PR Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "apps/**"

jobs:
  lint-and-build:
    name: Test Bundling for Electron Client (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macOS-latest, ubuntu-latest ]
        arch: [ x64 ]
        include:
        - os: macOS-latest
          arch: arm64

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-repo

      - name: Build
        run: pnpm run build

      - name: Run Lint
        run: pnpm run lint

      - name: Build Electron Package
        run: pnpm run package
        working-directory: ./apps/electron-client

      - name: Run Unit Tests
        run: pnpm -r test

      - name: Run Electron e2e Tests
        run: pnpm --filter ./apps/electron-client run test:e2e
