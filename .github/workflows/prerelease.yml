name: v3 prerelease

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/release/**"
      - ".github/workflows/prerelease.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      version:
        description: "v3 prerelease version (for example 3.0.0-alpha.1)"
        required: true
        type: string
      dry_run:
        description: "Build and smoke-test without publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: prerelease-${{ github.event_name == 'workflow_dispatch' && inputs.version || 'main' }}
  cancel-in-progress: false

jobs:
  # Fails closed before `publish`: reuses a passing CI `verify` check run for
  # this commit SHA, fails fast if CI verify failed, and runs `bun run verify`
  # locally in this job as the fallback gate on any other path.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: ci
        name: Reuse CI verify for this commit when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/wait-ci-verify.ts --output "$GITHUB_OUTPUT"
      - if: steps.ci.outputs.run_local == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - if: steps.ci.outputs.run_local == 'true'
        name: Ensure tmux
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      - if: steps.ci.outputs.run_local == 'true'
        run: bun install --frozen-lockfile
      - if: steps.ci.outputs.run_local == 'true'
        run: bun run verify

  build:
    # Playwright 1.58 targets ubuntu-24.04 (which already ships Chromium's
    # runtime shared libraries, so only the browser binary needs caching).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      create_release: ${{ steps.plan.outputs.create_release }}
      publish_packages: ${{ steps.plan.outputs.publish_packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Inputs reach the shell only through env, never interpolated into the
      # script text, so a crafted version cannot run before it is validated.
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            bun scripts/release/prerelease.ts plan --canary --output "$GITHUB_OUTPUT"
          else
            bun scripts/release/prerelease.ts plan --version "$VERSION" --output "$GITHUB_OUTPUT"
          fi
      - env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: bun run release:build --version "$VERSION"
      - run: bun run release:smoke
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.58.0
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
        run: .cache/browser-demo/deps/node_modules/.bin/playwright install chromium
      - name: Web tarball browser e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
        run: bun run release:web:e2e
      - name: Stage release artifacts
        run: |
          mkdir -p .cache/release/artifact
          cp -R .cache/release/tarballs .cache/release/artifact/tarballs
          cp packages/protocol/schema/embedder-v2.schema.json .cache/release/artifact/embedder-v2.schema.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blast-v3-${{ steps.plan.outputs.version }}
          path: .cache/release/artifact
          if-no-files-found: error

  publish:
    if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && needs.build.outputs.publish_packages != '' }}
    needs: [verify-ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # Trusted publishing: npm exchanges this job's OIDC token (id-token:
      # write) for a short-lived publish credential; no NPM_TOKEN is stored.
      - name: Require npm with trusted publishing
        run: bun scripts/release/prerelease.ts require-npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: blast-v3-${{ needs.build.outputs.version }}
          path: .cache/release/artifact
      - name: Publish packages under next
        env:
          PUBLISH_PACKAGES: ${{ needs.build.outputs.publish_packages }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for package in $PUBLISH_PACKAGES; do
            tarball_name="${package#@}"
            tarball_name="${tarball_name//\//-}-${VERSION}.tgz"
            tarball=".cache/release/artifact/tarballs/${tarball_name}"
            test -f "$tarball" || { echo "Missing tarball: $tarball" >&2; exit 1; }
            # Provenance is automatic with trusted publishing.
            npm publish "$tarball" --tag next --access public
          done
      - name: Tag and create GitHub prerelease
        if: ${{ needs.build.outputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --prerelease \
            --generate-notes \
            --title "Blast ${VERSION}" \
            .cache/release/artifact/tarballs/*.tgz \
            .cache/release/artifact/embedder-v2.schema.json
